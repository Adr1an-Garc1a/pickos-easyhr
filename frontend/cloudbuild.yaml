steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest'
      - '.'
    dir: 'frontend'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend'

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        AGENT_MASTER_URL=$(gcloud run services describe easyhr-agent-master \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')
        EMPLOYEE_API_URL=$(gcloud run services describe easyhr-employee-api \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')
        BIRTHDAY_URL=$(gcloud run services describe easyhr-birthday-agent \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')

        gcloud run deploy easyhr-frontend \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:${SHORT_SHA}" \
          --region="${_REGION}" --project="$PROJECT_ID" \
          --service-account="easyhr-frontend-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-env-vars="AGENT_MASTER_URL=$${AGENT_MASTER_URL},EMPLOYEE_API_URL=$${EMPLOYEE_API_URL},BIRTHDAY_AGENT_URL=$${BIRTHDAY_URL}" \
          --allow-unauthenticated \
          --min-instances=0 --max-instances=1 --cpu=1 --memory=512Mi --concurrency=40 --timeout=300 \
          --quiet

        for svc in easyhr-employee-api easyhr-agent-master easyhr-birthday-agent; do
          gcloud run services add-iam-policy-binding "$svc" \
            --project="$PROJECT_ID" --region="${_REGION}" \
            --member="serviceAccount:easyhr-frontend-sa@$PROJECT_ID.iam.gserviceaccount.com" \
            --role="roles/run.invoker" --quiet
        done

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest'

substitutions:
  _REGION: us-central1
  _REPO: easyhr-repo

options:
  logging: CLOUD_LOGGING_ONLY
