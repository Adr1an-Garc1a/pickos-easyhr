steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-master:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-master:latest'
      - '.'
    dir: 'services/agent-master'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-master'

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        BIRTHDAY_URL=$(gcloud run services describe easyhr-birthday-agent \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')
        VACATION_URL=$(gcloud run services describe easyhr-vacation-agent \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')
        JOBDESC_URL=$(gcloud run services describe easyhr-jobdesc-agent \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')

        gcloud run deploy easyhr-agent-master \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-master:${SHORT_SHA}" \
          --region="${_REGION}" --project="$PROJECT_ID" \
          --service-account="easyhr-agent-master-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-env-vars="BIRTHDAY_AGENT_URL=$${BIRTHDAY_URL},VACATION_AGENT_URL=$${VACATION_URL},JOBDESC_AGENT_URL=$${JOBDESC_URL},GOOGLE_GENAI_USE_VERTEXAI=${_USE_VERTEXAI},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL}" \
          --no-allow-unauthenticated \
          --min-instances=0 --max-instances=1 --cpu=1 --memory=1Gi --concurrency=10 --timeout=300 \
          --quiet

        for svc in easyhr-birthday-agent easyhr-vacation-agent easyhr-jobdesc-agent; do
          gcloud run services add-iam-policy-binding "$svc" \
            --project="$PROJECT_ID" --region="${_REGION}" \
            --member="serviceAccount:easyhr-agent-master-sa@$PROJECT_ID.iam.gserviceaccount.com" \
            --role="roles/run.invoker" --quiet
        done

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-master:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent-master:latest'

substitutions:
  _REGION: us-central1
  _REPO: easyhr-repo
  _USE_VERTEXAI: "TRUE"
  _GEMINI_MODEL: gemini-2.5-flash

options:
  logging: CLOUD_LOGGING_ONLY
