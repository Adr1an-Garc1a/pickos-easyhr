steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/jobdesc-agent:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/jobdesc-agent:latest'
      - '.'
    dir: 'services/jobdesc-agent'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/jobdesc-agent'

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        EMPLOYEE_API_URL=$(gcloud run services describe easyhr-employee-api \
          --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')

        gcloud run deploy easyhr-jobdesc-agent \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/jobdesc-agent:${SHORT_SHA}" \
          --region="${_REGION}" --project="$PROJECT_ID" \
          --service-account="easyhr-jobdesc-agent-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-env-vars="EMPLOYEE_API_URL=$${EMPLOYEE_API_URL},BUCKET_JOBDESC_REFS=$PROJECT_ID-jobdesc-references,GOOGLE_GENAI_USE_VERTEXAI=${_USE_VERTEXAI},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL}" \
          --no-allow-unauthenticated \
          --min-instances=0 --max-instances=1 --cpu=1 --memory=1Gi --concurrency=5 --timeout=300 \
          --quiet

        gcloud run services add-iam-policy-binding easyhr-employee-api \
          --project="$PROJECT_ID" --region="${_REGION}" \
          --member="serviceAccount:easyhr-jobdesc-agent-sa@$PROJECT_ID.iam.gserviceaccount.com" \
          --role="roles/run.invoker" --quiet

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/jobdesc-agent:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/jobdesc-agent:latest'

substitutions:
  _REGION: us-central1
  _REPO: easyhr-repo
  _USE_VERTEXAI: "TRUE"
  _GEMINI_MODEL: gemini-2.5-flash

options:
  logging: CLOUD_LOGGING_ONLY
