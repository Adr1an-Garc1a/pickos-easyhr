# Cloud Build para el servicio "easyhr-employee-api".
# Se dispara automáticamente (vía el trigger creado en infra/07_cicd_triggers.sh)
# cuando hay un push que toca esta carpeta. Construye la imagen, la publica en
# Artifact Registry con el tag = short SHA del commit (permite rollback) y
# despliega esa imagen a Cloud Run SIN tocar el resto de la configuración
# (env vars, VPC connector, Cloud SQL, secretos) que ya fue definida una vez
# en infra/06_deploy_cloud_run.sh.
steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/employee-api:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/employee-api:latest'
      - '.'
    dir: 'services/employee-api'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/employee-api'

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - 'easyhr-employee-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/employee-api:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--project=${PROJECT_ID}'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/employee-api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/employee-api:latest'

substitutions:
  _REGION: us-central1
  _REPO: easyhr-repo

options:
  logging: CLOUD_LOGGING_ONLY
